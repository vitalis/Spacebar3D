name: Release

# Pushing a release version tag (or running manually on that tag) builds,
# signs, notarizes, and attaches the DMG to a GitHub Release.
#
# Secrets to register beforehand (after joining the Apple Developer Program):
#   MACOS_CERTIFICATE      … Developer ID Application cert (.p12) base64-encoded
#                            base64 -i cert.p12 | pbcopy
#   MACOS_CERTIFICATE_PWD  … password for that .p12
#   KEYCHAIN_PASSWORD      … any password for the temporary keychain
#   APPLE_TEAM_ID          … Team ID (10 chars)
#   NOTARY_APPLE_ID        … Apple ID for notarization (email)
#   NOTARY_PASSWORD        … app-specific password (created at appleid.apple.com)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Default to read-only; only the release job gets a write token.
permissions:
  contents: read

jobs:
  release:
    # Only release from a v* tag. A manual run must also target a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: macos-26
    concurrency:
      group: release-${{ github.ref }}
    env:
      SIGN_IDENTITY: Developer ID Application
    steps:
      # Actions are pinned to commit SHAs (tag shown in the comment) so a moved tag
      # cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Do not leave the GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      - name: Validate the release tag
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: the release commit must be on main" >&2
            exit 1
          fi
          version="$(ruby -ryaml -e 'puts YAML.safe_load(File.read("project.yml")).fetch("settings").fetch("base").fetch("MARKETING_VERSION")')"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "error: the release tag must be vMAJOR.MINOR.PATCH and match MARKETING_VERSION ($version)" >&2
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26'

      # XcodeGen is installed and run before the certificate exists on the runner;
      # build.sh then reuses the generated project (SKIP_XCODEGEN=1).
      - name: Generate the Xcode project
        run: |
          brew install xcodegen cmake ninja
          ./scripts/build-assimp.sh
          xcodegen generate

      - name: Run the automated tests
        run: |
          xcodebuild test -project Spacebar3D.xcodeproj -scheme Spacebar3DTests \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/test-build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Check localizations
        run: python3 scripts/check-localizations.py

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate="$(mktemp "$RUNNER_TEMP/certificate.XXXXXX")"
          trap 'rm -f "$certificate"' EXIT
          keychain="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Build (Developer ID signed)
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SKIP_XCODEGEN: "1"
        run: ./scripts/build.sh

      - name: Check the built bundle versions
        run: |
          app="build/Build/Products/Release/Spacebar 3D.app"
          extension="$app/Contents/PlugIns/Spacebar3DExtension.appex"
          for bundle in "$app" "$extension"; do
            version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$bundle/Contents/Info.plist")"
            if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
              echo "error: $bundle version $version does not match $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done

      - name: Notarize & staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./scripts/notarize.sh

      # The disk image also uses the signing key. Remove it before the release action.
      - name: Delete the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi

      - name: Attach .dmg to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Spacebar3D.dmg
          fail_on_unmatched_files: true
